---
name: Analyze Honeypot Logs

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Analysis Scripts
        run: |
          echo "Generating report from mock logs..."
          echo "--- PASSWORD REPORT ---" > report.txt
          python analysis/top_passwords.py data/mock_cowrie.json >> report.txt
          echo -e "\n--- GEO REPORT ---" >> report.txt
          python analysis/geo_map.py data/mock_cowrie.json >> report.txt
          cat report.txt

      - name: Upload Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: honeypot-analysis-report
          path: report.txt
